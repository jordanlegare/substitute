[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ald-media-controller"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "qrcode>=7.4,<9",
  "zxing-cpp>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
signature = ["cryptography>=42,<47"]

[project.scripts]
ald-media-controller = "ald_media_controller:main"

[tool.setuptools]
py-modules = [
  "ald_core",
  "ald_hardened_core",
  "ald_media_codecs",
  "ald_media_staging",
  "ald_compression",
  "ald_media_controller",
  "ald_media_cli",
  "ald_hls_integration",
  "ald_hls_packaging",
  "ald_hls_bundle",
  "ald_hls_signature",
  "ald_hls_verify",
  "ald_product_scene",
  "ald_product_svg",
  "ald_product_data",
  "ald_product_render",
  "ald_product_mp4",
  "ald_product_bundle",
  "ald_product_verify",
  "ald_product_cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "requires_ffmpeg: requires local FFmpeg H.264/AAC/fMP4/HLS capabilities",
]
