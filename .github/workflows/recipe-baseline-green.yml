name: Recipe baseline green

on:
  push:
    branches:
      - automation/atomiclimits-live-discovery

permissions:
  contents: write

jobs:
  patch-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recipe-evidence-expansion
          fetch-depth: 0
      - name: Exclude expansion outputs from historical baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          code = base64.b64decode("")
          exec(compile(code, "baseline_patch.py", "exec"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/refresh_recipe_evidence.py
          git commit -m "fix: keep expansion outputs out of recipe baseline"
          git push origin HEAD:feature/recipe-evidence-expansion
