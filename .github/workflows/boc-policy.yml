name: BoC policy research engine

on:
  pull_request:
    paths:
      - "boc_policy/**"
      - "tests/test_boc_policy.py"
      - "docs/boc-policy-research.md"
      - "docs/superpowers/specs/2026-09-06-boc-policy-research-engine-design.md"
      - "docs/superpowers/plans/2026-09-06-boc-policy-research-engine.md"
      - "pyproject.toml"
      - ".github/workflows/boc-policy.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Tests
        run: python -m pytest -q tests/test_boc_policy.py
      - name: Compile
        run: python -m py_compile boc_policy/*.py
      - name: CLI smoke
        run: >-
          boc-policy-research
          --profile mandate_first
          --simulations 2
          --horizon 2
          --max-candidates 2
          --json
