name: Plasma-ALD structure probe

on:
  push:
    branches:
      - automation/atomiclimits-live-discovery

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect one publication HTML structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.request

          url="https://www.plasma-ald.com/display_publicationv4.php?code=NvSuuNGs"
          text=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=60).read().decode("utf-8","replace")
          for token in ("Films","HfCpNM","T5xfTL","10.1116/1.4972210"):
              pos=text.find(token)
              print("TOKEN",token,"POS",pos)
              if pos>=0:
                  print(text[max(0,pos-1800):pos+2600].replace("\n"," "))
          print("TABLE_ROWS")
          for row in re.findall(r"<tr\b.*?</tr>",text,flags=re.I|re.S):
              plain=re.sub(r"<[^>]+>"," ",row)
              plain=re.sub(r"\s+"," ",plain).strip()
              hrefs=re.findall(r'href=["\']([^"\']+)',row,flags=re.I)
              if plain or hrefs:
                  print("ROW",plain[:1200],"HREFS",hrefs[:10])
          PY
