name: CatalystHub query diagnostic

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
    paths:
      - .github/workflows/catalysthub-query-diagnostic.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recipe-evidence-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4
      - name: Probe CatalystHub query response
        run: |
          python - <<'PY'
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from bs4 import BeautifulSoup
          import re

          url = 'https://www.catalysthub.net/utils/ajax-query.php'
          headers = {
              'User-Agent': 'substitute-recipe-evidence/1',
              'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
              'X-Requested-With': 'XMLHttpRequest',
              'Referer': 'https://www.catalysthub.net/ALDdatabase_query.php',
          }

          def query(keyword):
              body = urlencode({
                  'keyword': keyword,
                  'field': 'Material',
                  'year_from': '0',
                  'year_to': '9999',
              }).encode('ascii')
              req = Request(url, data=body, headers=headers, method='POST')
              raw = urlopen(req, timeout=90).read()
              soup = BeautifulSoup(raw, 'html.parser')
              table = soup.find('table', id='ALDTABLE')
              print('\nQUERY', keyword, 'BYTES', len(raw), 'TABLE', bool(table))
              if table is None:
                  print(raw[:1000].decode('utf-8', 'replace'))
                  return set()
              cols = [' '.join(th.stripped_strings) for th in table.find_all('th')]
              print('HEADERS', cols)
              rows = []
              for tr in table.find_all('tr'):
                  cells = [' '.join(td.stripped_strings) for td in tr.find_all('td')]
                  if cells:
                      rows.append(cells)
              print('ROWS', len(rows))
              for cells in rows[:3]:
                  print('ROW', cells)
              hrefs = []
              for a in table.find_all('a', href=True):
                  href = a.get('href', '')
                  if 'doi' in href.lower() or re.search(r'10\.\d{4,9}/', href):
                      hrefs.append(href)
              print('DOI_LINKS_SAMPLE', hrefs[:8])
              ids = {r[0] for r in rows if r}
              print('UNIQUE_IDS', len(ids), 'ID_SAMPLE', sorted(ids)[:8])
              return ids

          sets = {k: query(k) for k in ('Al', 'O', 'Si')}
          print('\nOVERLAP Al/O', len(sets['Al'] & sets['O']))
          print('OVERLAP Al/Si', len(sets['Al'] & sets['Si']))
          print('UNION', len(set().union(*sets.values())))
          PY
      - name: Remove diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/catalysthub-query-diagnostic.yml
          git commit -m "chore: complete CatalystHub query diagnostic"
          git push origin HEAD:feature/recipe-evidence-expansion
