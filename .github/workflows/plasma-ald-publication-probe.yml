name: Plasma-ALD publication probe

on:
  push:
    branches:
      - automation/atomiclimits-live-discovery

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f630f7e5f005a1e5ac49a7ac4455f35eed51675d
      - name: Inspect publication relationship model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.request
          from html import unescape

          headers={"User-Agent":"Mozilla/5.0 (Substitute evidence audit)","Accept":"text/html,*/*"}
          urls=[
            "https://www.plasma-ald.com/display_publicationv4.php?code=NvSuuNGs",
            "https://www.plasma-ald.com/search_comp_pubsv4.php?compcode=z8Dtaq",
          ]
          for url in urls:
              raw=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60).read()
              text=raw.decode("utf-8","replace")
              print("URL",url,"BYTES",len(raw))
              plain=re.sub(r"<script\b[^>]*>.*?</script>"," ",text,flags=re.I|re.S)
              plain=re.sub(r"<style\b[^>]*>.*?</style>"," ",plain,flags=re.I|re.S)
              plain=re.sub(r"<[^>]+>","\n",plain)
              plain=unescape(plain)
              lines=[re.sub(r"\s+"," ",line).strip() for line in plain.splitlines()]
              for line in lines:
                  if line and any(token in line.casefold() for token in (
                      "doi", "hafnium", "hfo", "precursor", "plasma", "reactant", "oxygen", "publication",
                      "hfcp", "chemical", "film", "journal", "author", "year", "citation"
                  )):
                      print("TEXT",line[:1500])
              links=re.findall(r'href=["\']([^"\']+)["\']',text,flags=re.I)
              for href in links:
                  if any(token in href.casefold() for token in ("chem", "comp", "publication", "doi.org", "crossref")):
                      print("LINK",href[:1000])
          PY
