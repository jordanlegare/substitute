name: Material catalog 8000 final verify

on:
  push:
    branches:
      - automation/material-catalog-8000-final-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/material-catalog-8000
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        run: python -m pip install -e '.[test,signature]'
      - name: Verify canonical material artifacts
        run: python tools/build_material_catalog.py --check --target-count 8000
      - name: Verify no TDD helper workflow remains
        run: test ! -e .github/workflows/material-catalog-8000-red.yml
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Run full repository suite
        run: python -m pytest -q
