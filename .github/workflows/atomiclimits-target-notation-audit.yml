name: AtomicLimits target notation audit

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
    paths:
      - .github/workflows/atomiclimits-target-notation-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recipe-evidence-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit invalid material notations
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from urllib.request import Request, urlopen
          import json, re, unicodedata
          import ald_materials as materials

          url='https://www.atomiclimits.com/alddatabase/api/processes.php'
          payload=json.loads(urlopen(Request(url,headers={'User-Agent':'substitute-recipe-evidence/1','Accept':'application/json'}),timeout=60).read().decode('utf-8-sig'))
          processes=payload['processes']
          catalog=json.loads(open('materials/catalog.json',encoding='utf-8').read())['entries']
          formula_set=set(); aliases=defaultdict(set)
          for e in catalog:
              raw=e.get('reduced_formula',e.get('formula'))
              try: reduced,els=materials.reduce_formula(raw)
              except Exception: continue
              if len(els)<2: continue
              formula_set.add(reduced)
              for key in ('name','material_name','formula','reduced_formula','display_name'):
                  v=e.get(key)
                  if isinstance(v,str) and v.strip():
                      aliases[' '.join(v.casefold().split())].add(reduced)

          invalid=Counter()
          for p in processes:
              raw=str(p.get('process_material','')).strip()
              if not raw: continue
              try: materials.reduce_formula(raw); continue
              except Exception: invalid[raw]+=1

          print('INVALID_ROWS',sum(invalid.values()),'UNIQUE_INVALID_LABELS',len(invalid))
          for raw,count in invalid.most_common(160):
              print('INVALID',count,json.dumps(raw,ensure_ascii=False))

          exact_alias_hits={}
          for raw in invalid:
              key=' '.join(raw.casefold().split())
              hits=aliases.get(key,set())
              if len(hits)==1: exact_alias_hits[raw]=next(iter(hits))
          print('EXACT_CATALOG_ALIAS_HITS',len(exact_alias_hits))
          for raw,reduced in sorted(exact_alias_hits.items())[:100]: print('ALIAS',json.dumps(raw,ensure_ascii=False),'->',reduced)

          # Conservative token extraction: accept only if the source label contains exactly
          # one standalone formula-like token that reduce_formula accepts and it maps to catalog.
          token_hits={}
          for raw in invalid:
              normalized=unicodedata.normalize('NFKC',raw)
              candidates=set()
              for token in re.findall(r'(?<![A-Za-z0-9])([A-Z][A-Za-z0-9]*(?:[()\[\]][A-Za-z0-9]*)?)(?![A-Za-z0-9])',normalized):
                  try: reduced,els=materials.reduce_formula(token)
                  except Exception: continue
                  if len(els)>=2 and reduced in formula_set: candidates.add(reduced)
              if len(candidates)==1: token_hits[raw]=next(iter(candidates))
          print('UNAMBIGUOUS_EMBEDDED_FORMULA_HITS',len(token_hits))
          for raw,reduced in sorted(token_hits.items())[:120]: print('TOKEN',json.dumps(raw,ensure_ascii=False),'->',reduced)
          PY
      - name: Remove diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/atomiclimits-target-notation-audit.yml
          git commit -m "chore: complete AtomicLimits target notation audit"
          git push origin HEAD:feature/recipe-evidence-expansion
