name: Zenodo precursor dataset diagnostic

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
    paths:
      - .github/workflows/zenodo-precursor-dataset-diagnostic.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recipe-evidence-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect CC BY precursor dataset schema
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          import csv, io, json, re

          record_url='https://zenodo.org/api/records/19369337'
          record=json.loads(urlopen(Request(record_url,headers={'User-Agent':'substitute-recipe-evidence/1','Accept':'application/json'}),timeout=60).read().decode('utf-8'))
          meta=record.get('metadata',{})
          print('TITLE',meta.get('title'))
          print('LICENSE',meta.get('license'))
          print('DOI',meta.get('doi'))
          files=record.get('files',[])
          for f in files:
              print('FILE',f.get('key'),'SIZE',f.get('size'),'CHECKSUM',f.get('checksum'))

          wanted=[]
          for f in files:
              key=str(f.get('key',''))
              if re.search(r'(column|schema|source_reference|cleaned|raw)\.(csv|json|txt)$',key,re.I):
                  wanted.append(f)
          for f in wanted:
              key=str(f.get('key',''))
              url=(f.get('links') or {}).get('content') or (f.get('links') or {}).get('self')
              if not url: continue
              raw=urlopen(Request(url,headers={'User-Agent':'substitute-recipe-evidence/1'}),timeout=60).read()
              print('\n===',key,'BYTES',len(raw),'===')
              text=raw.decode('utf-8-sig','replace')
              if key.casefold().endswith('.csv'):
                  reader=csv.reader(io.StringIO(text))
                  rows=[]
                  for i,row in enumerate(reader):
                      rows.append(row)
                      if i>=3: break
                  for i,row in enumerate(rows): print('ROW',i,json.dumps(row,ensure_ascii=False))
              else:
                  print(text[:6000])
          PY
      - name: Remove diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zenodo-precursor-dataset-diagnostic.yml
          git commit -m "chore: complete precursor dataset diagnostic"
          git push origin HEAD:feature/recipe-evidence-expansion
