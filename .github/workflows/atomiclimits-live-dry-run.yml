name: AtomicLimits live dry run

on:
  push:
    branches:
      - automation/atomiclimits-live-discovery

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f630f7e5f005a1e5ac49a7ac4455f35eed51675d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure live evidence coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          from tools.refresh_recipe_evidence import build_frozen_evidence, parse_atomiclimits_api_payload

          url = "https://www.atomiclimits.com/alddatabase/api/processes.php"
          raw = urllib.request.urlopen(
              urllib.request.Request(url, headers={"User-Agent":"Substitute recipe evidence audit/1.0","Accept":"application/json"}),
              timeout=120,
          ).read()
          payload = json.loads(raw)
          records = parse_atomiclimits_api_payload(payload)
          materials = json.loads(Path("materials/catalog.json").read_text(encoding="utf-8"))
          recipes = json.loads(Path("recipes/compounds/catalog.json").read_text(encoding="utf-8"))
          evidence_doc, manifest, audit = build_frozen_evidence(
              records,
              materials,
              recipes,
              source_metadata={
                  "atomiclimits_database_doi":"10.6100/alddatabase",
                  "transport":"atomiclimits-live-api",
                  "api_url":url,
                  "api_sha256":hashlib.sha256(raw).hexdigest(),
                  "api_process_count":len(payload.get("processes",[])),
                  "api_reference_count":len(payload.get("references",[])),
              },
          )
          selected=[r for r in evidence_doc["records"] if r["selection_status"]=="selected"]
          covered=[r for r in evidence_doc["records"] if r["selection_status"]=="covered-existing"]
          rejected=[r for r in evidence_doc["records"] if r["selection_status"]=="rejected"]
          print("LIVE_API_SHA256",hashlib.sha256(raw).hexdigest())
          print("RAW_PROCESSES",len(payload.get("processes",[])))
          print("RAW_REFERENCES",len(payload.get("references",[])))
          print("PARSED_EVIDENCE_RECORDS",len(records))
          print("FROZEN_RECORDS_IN_8000_UNIVERSE",len(evidence_doc["records"]))
          print("SELECTED_NEW_TARGETS",len(selected))
          print("COVERED_EXISTING_RECORDS",len(covered))
          print("REJECTED_RECORDS",len(rejected))
          print("SELECTED_FAMILY",dict(sorted(collections.Counter(r["process_family"] for r in selected).items())))
          print("SELECTED_GRADES",dict(sorted(collections.Counter(r["evidence_grade"] for r in selected).items())))
          print("AUDIT",json.dumps(audit,sort_keys=True))
          print("MANIFEST_SOURCE",json.dumps(manifest.get("sources",{}),sort_keys=True))
          PY
