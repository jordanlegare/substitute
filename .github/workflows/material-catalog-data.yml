name: Material catalog data acquisition

on:
  push:
    branches:
      - automation/material-catalog-data

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/material-catalog-1000
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and acquisition dependencies
        run: python -m pip install -e '.[test]' 'duckdb>=1.1,<2'
      - name: Material catalog focused tests
        run: python -m pytest -q tests/test_material_catalog.py tests/test_material_catalog_ranking.py
      - name: Acquire full normalized COD mirror candidate pool
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import duckdb
          import ald_materials as materials
          from tools import build_material_catalog as builder

          url = 'https://huggingface.co/datasets/LMucko/crystallography-open-database/resolve/main/cod_full.parquet'
          con = duckdb.connect()
          con.execute('INSTALL httpfs')
          con.execute('LOAD httpfs')
          rows = con.execute(
              '''
              SELECT file, formula, sg, mineral, chemname, commonname, doi, title, journal, year
              FROM read_parquet(?)
              WHERE formula IS NOT NULL AND file IS NOT NULL
              ORDER BY file
              ''',
              [url],
          ).fetchall()

          by_formula = {}
          for row in rows:
              file_id, formula, sg, mineral, chemname, commonname, doi, title, journal, year = row
              cleaned = str(formula).strip().strip('-').strip()
              if not cleaned:
                  continue
              try:
                  reduced, elements = materials.reduce_formula(cleaned)
              except ValueError:
                  continue
              if len(elements) < 2:
                  continue
              if 'C' in elements and 'H' in elements:
                  continue
              classes = builder.classify_material(elements, reduced, {})
              if not classes:
                  continue
              group = by_formula.setdefault(reduced, [])
              if len(group) >= 2:
                  continue
              name = next(
                  (str(value).strip() for value in (mineral, chemname, commonname) if value and str(value).strip()),
                  reduced,
              )
              record = {
                  'source': 'cod',
                  'source_id': str(file_id),
                  'formula': cleaned,
                  'name': name,
              }
              if sg and str(sg).strip():
                  record['space_group'] = str(sg).strip()
              if doi and str(doi).strip():
                  record['doi'] = str(doi).strip()
              reference_parts = [str(value).strip() for value in (title, journal, year) if value and str(value).strip()]
              if reference_parts:
                  record['reference'] = ' | '.join(reference_parts)
              group.append(record)

          def formula_key(reduced):
              counts = materials.parse_formula(reduced)
              return (len(counts), sum(counts.values()), reduced)

          retained_formulas = sorted(by_formula, key=formula_key)[:8000]
          records = [record for formula in retained_formulas for record in by_formula[formula]]
          if len(retained_formulas) < 2000:
              raise SystemExit(f'insufficient eligible COD formulas: {len(retained_formulas)}')

          source_root = Path('materials/sources')
          source_root.mkdir(parents=True, exist_ok=True)
          (source_root / 'cod-materials.json').write_bytes(
              materials.canonical_json_bytes({'records': records})
          )
          (source_root / 'pubchem-identities.json').write_bytes(
              materials.canonical_json_bytes({'records': []})
          )
          Path('materials/source-manifest.json').parent.mkdir(parents=True, exist_ok=True)
          Path('materials/source-manifest.json').write_bytes(
              materials.canonical_json_bytes({
                  'retrieved_at': '2026-09-06T00:00:00Z',
                  'source_metadata': {
                      'cod': {
                          'primary_database': 'Crystallography Open Database',
                          'transport_mirror': 'LMucko/crystallography-open-database',
                          'mirror_snapshot_date': '2026-07-06',
                          'license': 'CC0-1.0',
                          'mirror_parquet': url,
                          'full_rows_scanned': len(rows),
                          'retained_unique_formula_pool': len(retained_formulas),
                      },
                      'pubchem': {
                          'status': 'optional-enrichment-pending-selected-catalog-pass'
                      },
                  },
                  'selection_policy_version': 'materials-1000-v2',
              })
          )
          print(json.dumps({
              'queried_rows': len(rows),
              'eligible_unique_formulas': len(by_formula),
              'retained_unique_formulas': len(retained_formulas),
              'normalized_records': len(records),
          }, sort_keys=True))
          PY
      - name: Build preliminary exact 1000-material catalog
        run: python tools/build_material_catalog.py --target-count 1000
      - name: Enrich unambiguous selected formulas from PubChem
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import ald_materials as materials
          from tools import refresh_material_sources as refresh

          catalog = json.loads(Path('materials/catalog.json').read_text())
          results = []
          for index, entry in enumerate(catalog['entries'], start=1):
              formula = entry['reduced_formula']
              encoded = urllib.parse.quote(formula, safe='')
              url = (
                  'https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/fastformula/'
                  + encoded
                  + '/property/IUPACName,Title,InChI,InChIKey,MolecularFormula/JSON'
              )
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  time.sleep(0.26)
                  continue
              props = payload.get('PropertyTable', {}).get('Properties', [])
              if len(props) != 1:
                  time.sleep(0.26)
                  continue
              normalized = refresh.normalize_pubchem_payload(formula, payload)
              if normalized is not None:
                  try:
                      matched, _ = materials.reduce_formula(normalized['molecular_formula'])
                  except (KeyError, ValueError):
                      matched = ''
                  if matched == formula:
                      results.append(normalized)
              if index % 100 == 0:
                  print(f'PubChem checked {index}/1000; accepted {len(results)}')
              time.sleep(0.26)
          Path('materials/sources/pubchem-identities.json').write_bytes(
              materials.canonical_json_bytes({'records': results})
          )
          print(f'PubChem unambiguous enrichments: {len(results)}')
          PY
      - name: Rebuild canonical exact 1000-material catalog
        run: python tools/build_material_catalog.py --target-count 1000
      - name: Verify acquisition invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import ald_materials as materials
          payload = json.loads(Path('materials/catalog.json').read_text())
          counted = [x for x in payload['entries'] if x['counted']]
          assert payload['counted_non_elemental_reduced_formula_count'] == 1000
          assert len(counted) == 1000
          assert len({x['reduced_formula'] for x in counted}) == 1000
          assert all(len(x['elements']) >= 2 for x in counted)
          assert all(x['provenance'] for x in counted)
          assert all(not ('C' in x['elements'] and 'H' in x['elements']) for x in counted)
          required = ['HfO2', 'Al2O3', 'O2Ti', 'O2Si', 'OZn', 'GaN', 'AlN', 'NTi', 'MoS2', 'S2W']
          formulas = {x['reduced_formula'] for x in counted}
          missing = [formula for formula in required if formula not in formulas]
          if missing:
              raise SystemExit(f'common materials missing after full scan/ranking: {missing}')
          print('verified exactly 1000 unique provenance-backed materials including common thin-film references')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: material-catalog-data-v2
          path: |
            materials/sources/cod-materials.json
            materials/sources/pubchem-identities.json
            materials/source-manifest.json
            materials/catalog.json
            materials/build-audit.json
          retention-days: 7
