name: Material CLI TDD

on:
  push:
    branches:
      - automation/material-catalog-data

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/material-catalog-1000
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: >-
          python -m pytest -q
          tests/test_material_catalog.py
          tests/test_material_catalog_ranking.py
          tests/test_material_cli.py
