name: Recipe evidence Task 8

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
    paths:
      - .github/workflows/recipe-evidence-task8.yml

permissions:
  contents: write

jobs:
  docs-and-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recipe-evidence-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test,signature]'
      - name: Add recipe chemistry documentation and integration invariants
        run: |
          cat > docs/recipe-chemistry.md <<'EOF'
          # Recipe chemistry evidence

          Substitute keeps three concepts deliberately separate:

          1. **Material identity** — `materials/catalog.json` contains 8,000 fixed-stoichiometry identities with identity provenance.
          2. **Recipe chemistry evidence** — `recipes/evidence/process-evidence.json` records literature-backed target/reactant identity and publication provenance.
          3. **Executable simulation recipes** — `recipes/compounds/catalog.json` points to deterministic, synthetic simulator programs. Their numerical execution values are not literature process conditions and are not fabrication instructions.

          ## Frozen coverage

          The current evidence sweep examined all 8,000 material identities against the pinned AtomicLimits-derived AWASES export plus the public AtomicLimits process API. The canonical audit records:

          - **250 executable recipes total**;
          - **150 newly selected distinct materials** from the evidence expansion;
          - **36 previously recipe-backed distinct material identities**;
          - **186 distinct recipe-backed material identities** after the expansion;
          - **7,814 identity-only materials remaining**;
          - **134 thermal-ALD** and **16 plasma-ALD** selected additions;
          - **150 R3 selections** and **zero selected R1/R2 records** in this frozen sweep.

          Evidence exhaustion, not a round recipe-count target, is the stopping rule. Variable-composition targets such as `TaNx`, `FeOx`, and `HfSixOy` are intentionally excluded from the fixed-stoichiometry material catalog rather than being guessed into a composition. Precursor-only datasets cannot create a recipe unless a source explicitly links a fixed target to its reactants.

          ## Explore chemistry

          The primary read-only interface is `ald-master chemistry`:

          ```bash
          ald-master chemistry search HfO2
          ald-master chemistry show HfO2
          ald-master chemistry sources HfO2
          ald-master chemistry list --process-family plasma-ald --limit 50
          ald-master chemistry report
          ```

          Use `--json` for machine-readable output. The chemistry projection exposes only target identity, process-family classification, source reactant labels/canonical identities when available, evidence grade, source references, origin, and recipe links. It does not project recipe instruction payloads or simulator operating values.

          `ald-master materials show ...` remains the identity-oriented view. It cross-links an exact executable recipe when one exists, but missing recipe evidence remains identity-only rather than being inferred.

          ## Evidence sources and reproducibility

          `recipes/evidence/source-manifest.json` pins the frozen AWASES repository/ref/blob/content digests and records the live AtomicLimits endpoint used for the acquisition sweep. The frozen acquisition combined 536 AWASES candidates with 1,198 live API candidates, for 1,734 source candidates before deterministic validation, deduplication, grading, and selection.

          Normal runtime and canonical rebuild checks are offline. The network acquisition step is not needed to use the checked-in evidence or recipes.

          Rebuild/check the generated state with:

          ```bash
          python tools/audit_recipe_evidence.py
          python tools/build_recipe_expansion.py --check
          python tools/build_compound_catalog.py --check
          python tools/build_material_catalog.py --check --target-count 8000
          ```

          ## Scientific and safety boundary

          Literature evidence supports **chemistry identity/provenance only**. Generated expansion recipes carry exact source reactant labels and direct publication identifiers, while executable ordering and numerical simulator values come from a fixed synthetic template. `physical_fabrication_mapping` remains false.

          Substitute does not turn literature temperatures, pressures, pulse times, purge times, flows, plasma settings, equipment details, or precursor-handling information into executable values. Recipe chemistry evidence is not a chemical-mixing, equipment-safety, process-window, or fabrication-readiness determination.
          EOF

          cat > tests/test_recipe_evidence_integration.py <<'EOF'
          import json
          from pathlib import Path

          import ald_core as core
          import ald_materials as materials
          import ald_recipe_evidence as evidence_core


          ROOT = Path(__file__).resolve().parents[1]


          def load_json(path: str):
              return json.loads((ROOT / path).read_text(encoding="utf-8"))


          def reduced_formula(value: str) -> str:
              reduced, _elements = materials.reduce_formula(value)
              return reduced


          def test_selected_evidence_and_expansion_recipes_are_one_to_one_and_compile():
              evidence_document = load_json("recipes/evidence/process-evidence.json")
              catalog = load_json("recipes/compounds/catalog.json")
              audit = load_json("recipes/evidence/acquisition-audit.json")

              records = [
                  evidence_core.validate_evidence_record(record)
                  for record in evidence_document["records"]
              ]
              selected = [record for record in records if record["selection_status"] == "selected"]
              expansion = [
                  entry
                  for entry in catalog["entries"]
                  if entry.get("recipe_origin") == "evidence-expansion"
              ]
              historical = [
                  entry
                  for entry in catalog["entries"]
                  if entry.get("recipe_origin") != "evidence-expansion"
              ]

              expected_count = audit["counts"]["new_distinct_materials_selected"]
              assert len(selected) == expected_count
              assert len(expansion) == expected_count
              assert all(record["evidence_grade"] in {"R2", "R3"} for record in selected)
              assert not any(
                  record["selection_status"] == "selected" and record["evidence_grade"] == "R1"
                  for record in records
              )

              selected_ids = [record["evidence_id"] for record in selected]
              expansion_ids = [entry["evidence_record_id"] for entry in expansion]
              assert len(selected_ids) == len(set(selected_ids))
              assert len(expansion_ids) == len(set(expansion_ids))
              assert set(expansion_ids) == set(selected_ids)

              selected_targets = [record["target_reduced_formula"] for record in selected]
              assert len(selected_targets) == len(set(selected_targets))

              historical_targets = set()
              for entry in historical:
                  try:
                      historical_targets.add(reduced_formula(entry["target_formula"]))
                  except ValueError:
                      pass
              assert set(selected_targets).isdisjoint(historical_targets)

              evidence_by_id = {record["evidence_id"]: record for record in selected}
              for entry in expansion:
                  record = evidence_by_id[entry["evidence_record_id"]]
                  assert reduced_formula(entry["target_formula"]) == record["target_reduced_formula"]
                  assert entry["process_family"] == record["process_family"]
                  expected_sources = sorted(
                      (publication["type"], publication["identifier"])
                      for publication in record["publications"]
                  )
                  actual_sources = sorted(
                      (source["type"], source["identifier"])
                      for source in entry["source_references"]
                  )
                  assert actual_sources == expected_sources

                  recipe_path = ROOT / entry["path"]
                  raw_recipe = json.loads(recipe_path.read_text(encoding="utf-8"))
                  assert raw_recipe["metadata"]["evidence_record_id"] == record["evidence_id"]
                  assert raw_recipe["metadata"]["physical_fabrication_mapping"] is False
                  assert "synthetic simulator values" in raw_recipe["metadata"]["simulation_notice"]
                  core.compile_recipe(core.validate_recipe(raw_recipe))


          def test_frozen_audit_counts_match_catalog_and_material_coverage():
              catalog = load_json("recipes/compounds/catalog.json")
              material_catalog = load_json("materials/catalog.json")
              audit = load_json("recipes/evidence/acquisition-audit.json")

              expansion = [
                  entry
                  for entry in catalog["entries"]
                  if entry.get("recipe_origin") == "evidence-expansion"
              ]
              assert len(catalog["entries"]) == audit["counts"]["final_executable_recipe_count"]
              assert len(expansion) == audit["counts"]["new_distinct_materials_selected"]
              assert len(material_catalog["entries"]) == audit["counts"]["material_identities_examined"]
              assert (
                  audit["counts"]["existing_recipe_backed_materials"]
                  + audit["counts"]["new_distinct_materials_selected"]
                  + audit["counts"]["remaining_identity_only_materials"]
                  == audit["counts"]["material_identities_examined"]
              )
          EOF

          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = 'See [`docs/material-catalog.md`](docs/material-catalog.md) for provenance, counting rules, offline rebuilds, CLI details, and the identity/process-evidence boundary.\n'
          addition = '''\n## Recipe chemistry evidence\n\nThe current frozen evidence sweep expands the executable catalog to **250 recipes**. It selects one best direct-evidence chemistry for **150 newly supported distinct materials**, taking exact recipe-backed material coverage to **186 of 8,000 identities** and leaving **7,814 identity-only**. The expansion is chemistry/provenance evidence only: generated execution values remain a fixed synthetic simulator template with no physical fabrication mapping.\n\nExplore the safe chemistry projection with:\n\n```bash\nald-master chemistry search HfO2\nald-master chemistry show HfO2\nald-master chemistry sources HfO2\nald-master chemistry report\n```\n\nSee [`docs/recipe-chemistry.md`](docs/recipe-chemistry.md) for evidence grading, source provenance, coverage, rebuild checks, and the simulation/fabrication boundary.\n'''
          if '## Recipe chemistry evidence\n' not in text:
              if marker not in text:
                  raise SystemExit('README insertion marker not found')
              text = text.replace(marker, marker + addition, 1)
              readme.write_text(text, encoding='utf-8')

          material_doc = Path('docs/material-catalog.md')
          text = material_doc.read_text(encoding='utf-8')
          marker = 'A material appearing in `materials/catalog.json` is **not** a claim that Substitute has a validated ALD/MLD process for it. Most entries are identity-only. Only records whose `process_evidence.status` is `executable-recipe` link to checked-in Substitute recipe IDs and paths.\n'
          addition = '''\nThe current frozen recipe-evidence expansion provides exact executable-recipe links for **186 distinct material identities**: 36 historical recipe-backed identities plus 150 newly selected direct-evidence targets. **7,814 of the 8,000 identities remain identity-only.** These counts describe evidence coverage, not chemical safety or fabrication readiness. See [`recipe-chemistry.md`](recipe-chemistry.md) for the chemistry/provenance view.\n'''
          if '7,814 of the 8,000 identities remain identity-only' not in text:
              if marker not in text:
                  raise SystemExit('material catalog insertion marker not found')
              text = text.replace(marker, marker + addition, 1)
              material_doc.write_text(text, encoding='utf-8')
          PY
      - name: Verify new integration invariants and docs-adjacent behavior
        run: |
          python -m pytest -q \
            tests/test_recipe_evidence_integration.py \
            tests/test_chemistry_catalog.py \
            tests/test_chemistry_cli.py \
            tests/test_material_cli.py
          python tools/audit_recipe_evidence.py
          python tools/build_recipe_expansion.py --check
          python tools/build_compound_catalog.py --check
          python tools/build_material_catalog.py --check --target-count 8000
          git diff --check
      - name: Commit verified Task 8 artifacts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/recipe-evidence-task8.yml
          git add README.md docs/material-catalog.md docs/recipe-chemistry.md tests/test_recipe_evidence_integration.py
          git commit -m "docs: finalize recipe chemistry evidence expansion"
          git push origin HEAD:feature/recipe-evidence-expansion
