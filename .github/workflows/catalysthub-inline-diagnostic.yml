name: CatalystHub inline diagnostic

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
    paths:
      - .github/workflows/catalysthub-inline-diagnostic.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recipe-evidence-expansion
      - name: Extract relevant inline JavaScript
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          import re
          url='https://www.catalysthub.net/ALDdatabase_query.php'
          html=urlopen(Request(url,headers={'User-Agent':'substitute-recipe-evidence/1'}),timeout=60).read().decode('utf-8','replace')
          for needle in ['dataDownload','submitSearch','$.ajax','XMLHttpRequest','download','csv','query_result','DataTable']:
              print('\n===',needle,'===')
              for m in list(re.finditer(re.escape(needle),html,re.I))[:12]:
                  lo=max(0,m.start()-1400); hi=min(len(html),m.end()+2800)
                  print(html[lo:hi].replace('\r','')[:4500])
          print('\n=== TABLE HEADERS ===')
          for m in re.finditer(r'<th[^>]*>(.*?)</th>',html,re.I|re.S):
              txt=re.sub(r'<[^>]+>',' ',m.group(1))
              txt=' '.join(txt.split())
              if txt: print('TH',txt)
          PY
      - name: Remove diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/catalysthub-inline-diagnostic.yml
          git commit -m "chore: complete CatalystHub inline diagnostic"
          git push origin HEAD:feature/recipe-evidence-expansion
