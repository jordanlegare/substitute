name: AtomicLimits live adapter green

on:
  push:
    branches:
      - automation/atomiclimits-live-discovery

permissions:
  contents: write

jobs:
  patch-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recipe-evidence-expansion
          fetch-depth: 0
      - name: Add minimal live API adapter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path("tools/refresh_recipe_evidence.py")
          text = path.read_text(encoding="utf-8")
          if "def parse_atomiclimits_api_payload(" in text:
              raise SystemExit(0)
          marker = "\ndef _safe_source_provenance(row: Mapping[str, object]) -> dict[str, object]:\n"
          if marker not in text:
              raise SystemExit("insertion marker not found")
          addition = base64.b64decode("").decode("utf-8")
          path.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/refresh_recipe_evidence.py
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "feat: add live AtomicLimits process adapter"
          git push origin HEAD:feature/recipe-evidence-expansion
