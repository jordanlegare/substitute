name: Apply fast PubChem supplement prefilter

on:
  push:
    branches:
      - automation/material-catalog-8000-fast-supplement

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/material-catalog-8000
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: automation/material-catalog-8000-fast-supplement
          path: .helper
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fast supplement prefilter
        run: python .helper/.github/scripts/apply_fast_pubchem_supplement.py
      - run: python -m pip install -e '.[test]'
      - name: Verify PubChem material behavior
        run: >-
          python -m pytest -q
          tests/test_pubchem_rdf_audit.py
          tests/test_material_catalog_pubchem.py
          tests/test_material_catalog_ranking.py
      - name: Compile scanner
        run: python -m py_compile tools/refresh_material_sources.py
      - name: Commit optimization
        run: |
          rm -rf .helper
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/refresh_material_sources.py
          git diff --cached --check
          git commit -m "perf: fast-reject organic PubChem formulas"
          git push origin HEAD:feature/material-catalog-8000
