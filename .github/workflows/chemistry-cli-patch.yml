name: Apply chemistry CLI patch

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
    paths:
      - .github/workflows/chemistry-cli-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply facade patch
        run: python tools/apply_chemistry_cli_patch.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Remove one-shot helpers
        run: git rm tools/apply_chemistry_cli_patch.py .github/workflows/chemistry-cli-patch.yml
      - name: Commit facade implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ald_master/__init__.py
          git commit -m "feat: add chemistry exploration CLI"
          git push origin HEAD:feature/recipe-evidence-expansion
