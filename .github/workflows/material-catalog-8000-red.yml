name: Material catalog 8000 RED

on:
  push:
    branches:
      - feature/material-catalog-8000

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_pubchem_rdf_audit.py tests/test_material_catalog_8000.py
