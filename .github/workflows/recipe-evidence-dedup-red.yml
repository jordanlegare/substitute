name: Recipe evidence dedup RED

on:
  pull_request:
    branches:
      - feature/recipe-evidence-expansion

jobs:
  dedup-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_recipe_evidence_refresh.py::test_build_frozen_evidence_collapses_duplicate_canonical_evidence_ids -q
