name: Apply frozen evidence builder

on:
  push:
    branches:
      - automation/apply-frozen-evidence-builder

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/apply-frozen-evidence-builder
      - name: Apply staged patch
        run: python tools/patch_frozen_evidence_builder.py
      - name: Remove staging helpers
        run: |
          rm tools/patch_frozen_evidence_builder.py
          rm .github/workflows/apply-frozen-evidence-builder.yml
      - name: Commit applied implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/refresh_recipe_evidence.py tools/patch_frozen_evidence_builder.py .github/workflows/apply-frozen-evidence-builder.yml
          git commit -m "feat: build frozen recipe evidence artifacts"
          git push origin HEAD:automation/apply-frozen-evidence-builder
