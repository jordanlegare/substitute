name: Recipe evidence development

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test,signature]'
      - name: Focused evidence tests
        run: python -m pytest tests/test_recipe_evidence.py -q
      - name: Probe structured source schema
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import urllib.request

          url = "https://raw.githubusercontent.com/jd-coderepos/awases-ald/main/step%201/data/2-filtered-data.csv"
          with urllib.request.urlopen(url, timeout=60) as response:
              stream = io.TextIOWrapper(response, encoding="ISO-8859-1", newline="")
              reader = csv.DictReader(stream)
              print("AWASES_FIELDS=" + json.dumps(reader.fieldnames))
              first = next(reader)
              preview = {key: (value or "")[:160] for key, value in first.items()}
              print("AWASES_FIRST=" + json.dumps(preview, ensure_ascii=False, sort_keys=True))
          PY
