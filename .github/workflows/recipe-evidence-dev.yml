name: Recipe evidence development

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test,signature]'
      - name: Focused evidence tests
        run: |
          python -m pytest \
            tests/test_recipe_evidence.py \
            tests/test_recipe_evidence_refresh.py \
            tests/test_recipe_evidence_audit.py \
            -q
      - name: Audit canonical recipe evidence
        run: python tools/audit_recipe_evidence.py
