name: Zenodo precursor schema diagnostic

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
    paths:
      - .github/workflows/zenodo-precursor-schema-diagnostic.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recipe-evidence-expansion
      - name: Inspect dataset headers only
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          import csv, io, json

          record=json.loads(urlopen(Request('https://zenodo.org/api/records/19369337',headers={'User-Agent':'substitute-recipe-evidence/1','Accept':'application/json'}),timeout=60).read().decode('utf-8'))
          for f in record.get('files',[]):
              key=str(f.get('key',''))
              if not key.casefold().endswith('.csv'): continue
              url=(f.get('links') or {}).get('content') or (f.get('links') or {}).get('self')
              raw=urlopen(Request(url,headers={'User-Agent':'substitute-recipe-evidence/1'}),timeout=60).read()
              text=raw.decode('utf-8-sig','replace')
              reader=csv.reader(io.StringIO(text))
              header=next(reader,[])
              print('FILE',key)
              print('HEADER',json.dumps(header,ensure_ascii=False))
              folded=[str(x).casefold() for x in header]
              for concept,needles in {
                  'target_material':['target','film','material','deposit','product'],
                  'coreactant':['coreactant','co-reactant','reactant','oxidant','reductant'],
                  'precursor':['precursor','compound','molecule'],
                  'publication':['doi','reference','source','citation'],
              }.items():
                  hits=[header[i] for i,v in enumerate(folded) if any(n in v for n in needles)]
                  print('FIELD_HITS',concept,json.dumps(hits,ensure_ascii=False))
          PY
      - name: Remove diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zenodo-precursor-schema-diagnostic.yml
          git commit -m "chore: complete precursor schema diagnostic"
          git push origin HEAD:feature/recipe-evidence-expansion
