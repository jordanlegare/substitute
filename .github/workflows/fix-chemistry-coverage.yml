name: Fix chemistry coverage count

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
    paths:
      - .github/workflows/fix-chemistry-coverage.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recipe-evidence-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply minimal authoritative-count fix
        run: |
          python - <<'PY'
          from pathlib import Path

          chemistry = Path('ald_chemistry.py')
          text = chemistry.read_text(encoding='utf-8')
          old = '''def chemistry_report(\n    entries: Sequence[Mapping[str, object]], *, material_count: int = 8000\n) -> dict[str, object]:\n    if type(material_count) is not int or material_count < 0:\n        raise ValueError("material_count must be a non-negative integer")\n'''
          new = '''def chemistry_report(\n    entries: Sequence[Mapping[str, object]],\n    *,\n    material_count: int = 8000,\n    recipe_backed_material_count: int | None = None,\n) -> dict[str, object]:\n    if type(material_count) is not int or material_count < 0:\n        raise ValueError("material_count must be a non-negative integer")\n    if recipe_backed_material_count is not None:\n        if type(recipe_backed_material_count) is not int or recipe_backed_material_count < 0:\n            raise ValueError("recipe_backed_material_count must be a non-negative integer")\n        if recipe_backed_material_count > material_count:\n            raise ValueError("recipe_backed_material_count cannot exceed material_count")\n'''
          if old not in text:
              raise SystemExit('chemistry_report signature anchor not found')
          text = text.replace(old, new, 1)
          old = '    recipe_backed_materials_in_identity_catalog = len(material_ids)\n'
          new = '''    recipe_backed_materials_in_identity_catalog = (\n        len(material_ids)\n        if recipe_backed_material_count is None\n        else recipe_backed_material_count\n    )\n'''
          if old not in text:
              raise SystemExit('chemistry report count anchor not found')
          chemistry.write_text(text.replace(old, new, 1), encoding='utf-8')

          master = Path('ald_master/__init__.py')
          text = master.read_text(encoding='utf-8')
          old = '''    material_count = len(_load_material_entries(args))\n    result = chemistry_catalog.chemistry_report(entries, material_count=material_count)\n'''
          new = '''    material_entries = _load_material_entries(args)\n    material_count = len(material_entries)\n    material_summary = material_catalog.material_report(material_entries)\n    result = chemistry_catalog.chemistry_report(\n        entries,\n        material_count=material_count,\n        recipe_backed_material_count=int(material_summary["recipe_linked_materials"]),\n    )\n'''
          if old not in text:
              raise SystemExit('chemistry CLI count anchor not found')
          master.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install project
        run: python -m pip install -e '.[test,signature]'
      - name: Verify regression and canonical real-catalog count
        run: |
          python -m pytest tests/test_chemistry_catalog.py tests/test_chemistry_cli.py tests/test_chemistry_report_coverage.py -q
          ald-master chemistry report --json > /tmp/chemistry-report.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/chemistry-report.json', encoding='utf-8'))
          assert report['recipe_backed_materials_in_identity_catalog'] == 186, report
          assert report['remaining_identity_only_materials'] == 7814, report
          PY
          python tools/audit_recipe_evidence.py
          python tools/build_material_catalog.py --check --target-count 8000
      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-chemistry-coverage.yml
          git add ald_chemistry.py ald_master/__init__.py
          git diff --cached --check
          git commit -m "fix: use authoritative recipe-linked material count"
          git push origin HEAD:feature/recipe-evidence-expansion
