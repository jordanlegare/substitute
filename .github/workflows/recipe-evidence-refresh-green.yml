name: Recipe evidence refresh GREEN

on:
  pull_request:
    branches:
      - feature/recipe-evidence-expansion

jobs:
  refresh-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run recipe evidence refresh tests
        run: python -m pytest tests/test_recipe_evidence_refresh.py -q
