name: Apply 8000 material catalog docs

on:
  push:
    branches:
      - automation/material-catalog-8000-docs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/material-catalog-8000
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: automation/material-catalog-8000-docs
          path: .helper
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update material catalog documentation
        run: python .helper/.github/scripts/update_material_catalog_8000_docs.py
      - name: Verify milestone documentation
        run: |
          ! grep -nE '1,000-material identity catalog|--target-count 1000|exactly \*\*1,000' README.md docs/material-catalog.md
          grep -n '8,000-material identity catalog' README.md
          grep -n '7,122' README.md docs/material-catalog.md
          grep -n '878' README.md docs/material-catalog.md
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install full test dependencies
        run: python -m pip install -e '.[test,signature]'
      - name: Verify canonical material artifacts
        run: python tools/build_material_catalog.py --check --target-count 8000
      - name: Run full repository test suite
        run: python -m pytest -q
      - name: Commit documentation
        run: |
          rm -rf .helper
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/material-catalog.md
          git diff --cached --check
          git commit -m "docs: document audited 8000 material catalog"
          git push origin HEAD:feature/material-catalog-8000
