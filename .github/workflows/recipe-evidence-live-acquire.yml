name: Recipe evidence live acquisition

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
    paths:
      - .github/workflows/recipe-evidence-live-acquire.yml

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Substitute
        uses: actions/checkout@v4
        with:
          ref: feature/recipe-evidence-expansion
          path: substitute
      - name: Checkout pinned AWASES source
        uses: actions/checkout@v4
        with:
          repository: jd-coderepos/awases-ald
          ref: 1c67909db3b6219f168907f0552550bf82edb487
          path: awases
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: substitute
        run: python -m pip install -e '.[test,signature]'
      - name: Sweep pinned and live AtomicLimits evidence
        working-directory: substitute
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import ald_recipe_evidence as evidence
          from tools.refresh_recipe_evidence import (
              build_frozen_evidence,
              fetch_atomiclimits_records,
              parse_awases_rows,
          )

          source = Path('../awases/step 1/data/1-raw-data.csv')
          source_bytes = source.read_bytes()
          with source.open(encoding='ISO-8859-1', newline='') as stream:
              awases_records = parse_awases_rows(stream)
          live_records = fetch_atomiclimits_records(Path('.cache/recipe-evidence'))
          combined = awases_records + live_records

          material_catalog = json.loads(Path('materials/catalog.json').read_text(encoding='utf-8'))
          recipe_catalog = json.loads(Path('recipes/compounds/catalog.json').read_text(encoding='utf-8'))
          old_audit = json.loads(Path('recipes/evidence/acquisition-audit.json').read_text(encoding='utf-8'))
          old_selected = int(old_audit['counts']['new_distinct_materials_selected'])

          evidence_doc, manifest, audit = build_frozen_evidence(
              combined,
              material_catalog,
              recipe_catalog,
              source_metadata={
                  'transport': 'awases-plus-atomiclimits-live-api',
                  'awases_repository': 'jd-coderepos/awases-ald',
                  'awases_ref': '1c67909db3b6219f168907f0552550bf82edb487',
                  'awases_path': 'step 1/data/1-raw-data.csv',
                  'awases_blob_sha': 'efb2b34bf7a47b5d70038b1b340574f514bb94df',
                  'awases_content_sha256': hashlib.sha256(source_bytes).hexdigest(),
                  'awases_license': 'MIT',
                  'awases_license_blob_sha': '1fa6b40798b07cdc5e5699be79c1693cc2757e29',
                  'awases_candidate_count': len(awases_records),
                  'live_api_url': 'https://www.atomiclimits.com/alddatabase/api/processes.php',
                  'live_candidate_count': len(live_records),
              },
          )
          new_selected = int(audit['counts']['new_distinct_materials_selected'])
          print('AWASES_CANDIDATES', len(awases_records))
          print('LIVE_CANDIDATES', len(live_records))
          print('OLD_SELECTED', old_selected)
          print('NEW_SELECTED', new_selected)
          print('NEW_RECIPES_FROM_LIVE', new_selected - old_selected)
          print(json.dumps(audit, indent=2, sort_keys=True))
          if new_selected < old_selected:
              raise SystemExit('live evidence regressed selected material coverage')

          expanded = new_selected > old_selected
          Path('.live_expanded').write_text('yes' if expanded else 'no', encoding='ascii')
          if expanded:
              out = Path('recipes/evidence')
              (out / 'process-evidence.json').write_bytes(evidence.canonical_json_bytes(evidence_doc))
              (out / 'source-manifest.json').write_bytes(evidence.canonical_json_bytes(manifest))
              (out / 'acquisition-audit.json').write_bytes(evidence.canonical_json_bytes(audit))
          PY
      - name: Generate canonical recipes and catalogs
        working-directory: substitute
        run: |
          if [ "$(cat .live_expanded)" = yes ]; then
            python tools/build_recipe_expansion.py
            python tools/build_compound_catalog.py
            python tools/build_material_catalog.py --target-count 8000
          else
            echo "Live AtomicLimits produced no additional distinct recipe-backed materials."
          fi
      - name: Verify exact generated state
        working-directory: substitute
        run: |
          python tools/audit_recipe_evidence.py --check
          python tools/build_recipe_expansion.py --check
          python tools/build_compound_catalog.py --check
          python tools/build_material_catalog.py --check --target-count 8000
          python -m pytest -q \
            tests/test_recipe_evidence.py \
            tests/test_recipe_evidence_refresh.py \
            tests/test_recipe_evidence_live_refresh.py \
            tests/test_recipe_evidence_audit.py \
            tests/test_recipe_expansion.py \
            tests/test_compound_catalog.py \
            tests/test_chemistry_catalog.py \
            tests/test_chemistry_cli.py \
            tests/test_material_cli.py
          git diff --check
      - name: Commit promoted data and remove temporary workflow
        working-directory: substitute
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          expanded="$(cat .live_expanded)"
          rm -f .live_expanded
          git rm .github/workflows/recipe-evidence-live-acquire.yml
          if [ "$expanded" = yes ]; then
            git add recipes materials
            git commit -m "data: promote live AtomicLimits recipe expansion"
          else
            git commit -m "chore: complete live AtomicLimits recipe sweep"
          fi
          git push origin HEAD:feature/recipe-evidence-expansion
