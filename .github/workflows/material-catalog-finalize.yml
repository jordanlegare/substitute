name: Material catalog finalization

on:
  push:
    branches:
      - automation/material-catalog-finalize

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/material-catalog-1000
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Canonical catalog acceptance RED
        run: python -m pytest -q tests/test_material_catalog_real.py
