name: Apply material CLI implementation

on:
  push:
    branches:
      - automation/material-catalog-data

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/material-catalog-1000
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch ald-master material CLI
        run: python .github/scripts/apply_material_cli.py
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run material CLI tests
        run: >-
          python -m pytest -q
          tests/test_material_catalog.py
          tests/test_material_catalog_ranking.py
          tests/test_material_cli.py
          tests/test_ald_master_compatibility.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ald_master/__init__.py
          git diff --cached --check
          git commit -m "feat: add material discovery CLI"
          git push origin HEAD:feature/material-catalog-1000
