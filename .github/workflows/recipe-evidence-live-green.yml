name: Recipe evidence live GREEN

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
    paths:
      - .github/workflows/recipe-evidence-live-green.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recipe-evidence-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Add cached live AtomicLimits fetch wrapper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/refresh_recipe_evidence.py")
          text = path.read_text(encoding="utf-8")
          constant = 'ATOMICLIMITS_API_URL = "https://www.atomiclimits.com/alddatabase/api/processes.php"\n'
          anchor = 'ATOMICLIMITS_DATABASE_DOI = "10.6100/alddatabase"\n'
          if constant not in text:
              if anchor not in text:
                  raise SystemExit("AtomicLimits DOI anchor not found")
              text = text.replace(anchor, anchor + constant, 1)

          function = '''def fetch_atomiclimits_records(\n    cache_dir: Path,\n    fetcher: Callable[[str], bytes] = fetch_url_bytes,\n) -> list[dict[str, object]]:\n    """Fetch, cache, and strictly normalize the public AtomicLimits process index."""\n\n    payload = cached_fetch_json(\n        ATOMICLIMITS_API_URL,\n        cache_dir / "atomiclimits",\n        fetcher,\n    )\n    if not isinstance(payload, Mapping):\n        raise ValueError("AtomicLimits process response is not an object")\n    return parse_atomiclimits_api_payload(payload)\n'''
          insertion_anchor = "\n\ndef crossref_url(doi: str) -> str:\n"
          if "def fetch_atomiclimits_records(" not in text:
              if insertion_anchor not in text:
                  raise SystemExit("Crossref anchor not found")
              text = text.replace(insertion_anchor, "\n\n" + function + insertion_anchor, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify GREEN
        run: python -m pytest tests/test_recipe_evidence_live_refresh.py tests/test_recipe_evidence_refresh.py -q
      - name: Commit implementation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/recipe-evidence-live-green.yml
          git add tools/refresh_recipe_evidence.py
          git commit -m "feat: fetch cached live AtomicLimits evidence"
          git push origin HEAD:feature/recipe-evidence-expansion
