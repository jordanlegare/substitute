name: AtomicLimits live transport discovery

on:
  push:
    branches:
      - automation/atomiclimits-live-discovery

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live process transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request

          root = "https://www.atomiclimits.com/alddatabase/"
          script_url = urllib.parse.urljoin(root, "static/js/main.25c63c42.chunk.js")
          headers = {"User-Agent": "Mozilla/5.0", "Accept": "application/json,text/plain,*/*"}
          script = urllib.request.urlopen(urllib.request.Request(script_url, headers=headers), timeout=60).read().decode("utf-8", "replace")
          needle = "/api/processes.php"
          for match in re.finditer(re.escape(needle), script):
              start = max(0, match.start() - 1800)
              end = min(len(script), match.end() + 2200)
              print("PROCESS_API_JS_CONTEXT", script[start:end].replace("\n", " ")[:4500])

          for relative in ("api/processes.php", "api/references.php"):
              url = urllib.parse.urljoin(root, relative)
              try:
                  response = urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60)
                  raw = response.read()
                  print("API", relative, "STATUS", getattr(response, "status", None), "BYTES", len(raw), "CTYPE", response.headers.get("Content-Type"))
                  text = raw.decode("utf-8", "replace")
                  print("API_PREFIX", relative, text[:1200].replace("\n", " "))
                  try:
                      payload = json.loads(text)
                  except Exception as exc:
                      print("API_JSON_ERROR", relative, type(exc).__name__, str(exc)[:160])
                      continue
                  print("API_TYPE", relative, type(payload).__name__)
                  if isinstance(payload, list):
                      print("API_COUNT", relative, len(payload))
                      if payload:
                          print("API_FIRST_KEYS", relative, sorted(payload[0]) if isinstance(payload[0], dict) else type(payload[0]).__name__)
                          print("API_FIRST", relative, json.dumps(payload[0], sort_keys=True, ensure_ascii=False)[:3000])
                  elif isinstance(payload, dict):
                      print("API_KEYS", relative, sorted(payload)[:100])
                      for key, value in payload.items():
                          if isinstance(value, list):
                              print("API_LIST", relative, key, len(value))
                              if value and isinstance(value[0], dict):
                                  print("API_LIST_FIRST_KEYS", key, sorted(value[0]))
                                  print("API_LIST_FIRST", key, json.dumps(value[0], sort_keys=True, ensure_ascii=False)[:3000])
              except Exception as exc:
                  print("API_ERROR", relative, type(exc).__name__, str(exc)[:300])
          PY
