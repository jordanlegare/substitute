name: Apply material 8000 broadened identity pool

on:
  push:
    branches:
      - automation/material-catalog-8000-broaden

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/material-catalog-8000
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: automation/material-catalog-8000-broaden
          path: .helper
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply identity taxonomy patch
        run: python .helper/.github/scripts/broaden_material_identity_classes.py
      - run: python -m pip install -e '.[test]'
      - name: Focused identity and PubChem tests
        run: >-
          python -m pytest -q
          tests/test_material_catalog.py
          tests/test_material_catalog_ranking.py
          tests/test_material_catalog_pubchem.py
          tests/test_pubchem_rdf_audit.py
      - name: Compile builder
        run: python -m py_compile tools/build_material_catalog.py
      - name: Commit implementation
        run: |
          rm -rf .helper
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_material_catalog.py
          git diff --cached --check
          git commit -m "feat: broaden fixed inorganic material identities"
          git push origin HEAD:feature/material-catalog-8000
