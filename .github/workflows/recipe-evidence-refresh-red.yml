name: Recipe evidence refresh RED

on:
  push:
    branches:
      - automation/recipe-evidence-refresh-red

jobs:
  refresh-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Prove refresh test currently fails
        run: python -m pytest tests/test_recipe_evidence_refresh.py -q
