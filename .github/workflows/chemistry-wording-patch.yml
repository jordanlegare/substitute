name: Apply chemistry wording patch

on:
  push:
    branches:
      - feature/recipe-evidence-expansion
    paths:
      - .github/workflows/chemistry-wording-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply wording patch
        run: python tools/patch_chemistry_simulation_wording.py
      - name: Verify whitespace
        run: git diff --check
      - name: Remove one-shot helpers
        run: git rm tools/patch_chemistry_simulation_wording.py .github/workflows/chemistry-wording-patch.yml
      - name: Commit wording fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ald_master/__init__.py
          git commit -m "fix: clarify chemistry exploration is simulation-only"
          git push origin HEAD:feature/recipe-evidence-expansion
