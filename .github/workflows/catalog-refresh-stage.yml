name: Catalog staging refresh

on:
  push:
    branches:
      - feat/catalog-full-staging

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Regenerate deterministic catalog
        run: |
          python tools/build_compound_catalog.py
          python tools/build_compound_catalog.py --check
      - name: Commit regenerated catalog when needed
        shell: bash
        run: |
          if git diff --quiet -- recipes/compounds/catalog.json; then
            echo 'catalog already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recipes/compounds/catalog.json
          git commit -m 'catalog: refresh deterministic compound index'
          git push origin HEAD:feat/catalog-full-staging
